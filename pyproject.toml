[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kittylm"
version = "0.1.0.dev0"
description = "KittyLM: a personal language-model research platform within KittyOS."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "KrazyKitty" }]

# Runtime dependencies are lower-bounded, not pinned. Local development may use a

# ROCm-enabled PyTorch build; CI installs the CPU build appropriate to its environment.

dependencies = [
"torch>=2.4",
"numpy>=1.26",
"pyyaml>=6.0",
"regex>=2024.0",
]

[project.optional-dependencies]

# Development tools are pinned exactly so formatting, linting, type-checking and

# security-audit results remain stable between local runs and CI. Dependabot proposes updates.

dev = [
"pytest==9.1.1",
"ruff==0.16.7",
"mypy==2.3.1",
"pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://krazykitty.dev"
Repository = "https://github.com/krazykitty2503/kittylm"
Issues = "https://github.com/krazykitty2503/kittylm/issues"

[tool.setuptools.packages.find]
include = ["kittylm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
"gpu: requires a ROCm/CUDA GPU; run locally with `pytest -m gpu`, never in CI",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["kittylm"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "regex"]
ignore_missing_imports = true
