selection:
  decision: D-014
  variant: reference@bf16
  flag_setting: unset
  rule: Fastest bf16 variant (by tokens/s at the largest selection length) whose cells are ok at every
    selection length for one flag setting and whose outputs and gradients match the bf16 reference within
    the relative tolerance; ties prefer flag 'unset', then grid order.
  tokens_per_second_by_length:
    '256': 1168727.97
    '1024': 554742.94
limitations:
- Attention kernel only (random Q/K/V, 6 heads, head_dim 64); not a full-model or end-to-end training
  measurement.
- Single machine and driver/software stack; results do not transfer to other GPUs or PyTorch/ROCm versions.
- Throughput is wall-clock over a short synchronized window after warmup; run-to-run variance is not measured.
notes: Measured on a clean checkout of the recorded commit. Each cell uses a single synchronized measurement
  window after warmup; run-to-run variance is not measured (the reference path, which ignores the AOTriton
  flag, differed by up to ~10% between the two flag-setting runs of the first attempt).
